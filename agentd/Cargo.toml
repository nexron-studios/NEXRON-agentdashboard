[package]
name = "agentd"
version = "0.1.0"
description = "Runs Claude Code headless (stream-json) for the Agent Dashboard, locally or over SSH"
authors = ["NEXRON"]
edition = "2021"

[lib]
name = "agentd"

[[bin]]
name = "agentd"
path = "src/main.rs"

# Stand-in for `claude` in the integration tests; never shipped.
[[bin]]
name = "fake-claude"
path = "src/bin/fake_claude.rs"
required-features = ["fake-claude"]

[features]
fake-claude = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
